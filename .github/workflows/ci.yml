name: CI · tests, integration and AI release guard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: [6333:6333]
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: supportops_test
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://supportops:ci-only-password@localhost:5432/supportops_test
      TEST_QDRANT_URL: http://localhost:6333
      CODE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Migrate real PostgreSQL
        run: python -m scripts.migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: API, workflow, SQL and real Qdrant integration tests
        run: pytest --cov=supportops --cov-report=term-missing
      - name: Development evaluation
        run: python -m eval.run --split dev --output reports/dev.json
      - name: Holdout release guard
        run: python -m eval.run --split holdout
      - name: Validate browser JavaScript
        run: for file in supportops/web/*.js; do node --check "$file"; done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend regression tests and formatting
        run: npm test && npm run check:format
      - name: Validate Compose contract and build image
        run: docker compose config --quiet && docker build -t supportops:ci .
      - name: Container smoke test
        env:
          MODEL_PROVIDER: baseline
          EMBEDDING_PROVIDER: baseline
        run: |
          docker compose up -d --wait
          python -m scripts.smoke --url http://127.0.0.1:8010
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up containers
        if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ github.sha }}
          path: reports/*.json
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: helm lint infra/helm && helm template supportops infra/helm > /tmp/supportops.yaml
