services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No host port: only the Compose network can reach PostgreSQL.
  migrate:
    build: .
    command: ["python", "-m", "scripts.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://supportops:local-demo-only@db:5432/supportops
    depends_on:
      db:
        condition: service_healthy
  orders:
    build: .
    command: ["uvicorn", "supportops.orders_api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8010:8000"
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://supportops:local-demo-only@db:5432/supportops
      ORDERS_API_URL: http://orders:8000
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      DEMO_RELEASE: ${DEMO_RELEASE:-true}
      DEMO_AI_BUDGET_USD: ${DEMO_AI_BUDGET_USD:-5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-5.4-mini}
      VERIFIER_MODEL: ${VERIFIER_MODEL:-gpt-5.4-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8010}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-info.xenonimus@gmail.com}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-info.xenonimus@gmail.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_GROWTH_PRICE_ID: ${STRIPE_GROWTH_PRICE_ID:-}
      STRIPE_SCALE_PRICE_ID: ${STRIPE_SCALE_PRICE_ID:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      ALLOW_DEMO_SIGNUP: ${ALLOW_DEMO_SIGNUP:-false}
      FAULT_INJECTION_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      orders:
        condition: service_healthy
    restart: unless-stopped
  indexer:
    build: .
    init: true
    command: ["python", "-m", "scripts.index_worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker_health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
volumes:
  postgres:
