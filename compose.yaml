services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No host port: only the Compose network can reach PostgreSQL.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://supportops:local-demo-only@db:5432/supportops
    depends_on:
      db:
        condition: service_healthy
  orders:
    build: .
    command: ["uvicorn", "supportops.orders_api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://supportops:local-demo-only@db:5432/supportops
      ORDERS_API_URL: http://orders:8000
      MODEL_PROVIDER: ${MODEL_PROVIDER:-baseline}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      APP_API_KEY: ${APP_API_KEY:-}
      FAULT_INJECTION_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      orders:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
